<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Papelaria</title>

</head>
<body>

    <div class="container">
        <h1>Papelaria</h1>

        <h2>Monte seu orçamento</h2>

        <div class="produto">
            <label>Caneta(R$ 2,00)</label>
            <input type="number" id="caneta" min="0" value="0">
        </div>

        <div class="produto">
            <label>Caderno (R$ 15,00)</label>
            <input type="number" id="caderno" min="0" value="0">
        </div>

        <div class="produto">
            <label>Borracha (R$ 5,00)</label>
            <input type="number" id="borracha" min="0" value="0">
        </div>

        <button onclick="calcular()">Calcular Total</button>

        <h2 id="resultado">Total: R$ 0,00</h2>
    </div>
